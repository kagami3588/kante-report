<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宿命早見</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2b2622; --accent:#8a5a2b; --line:#e2d8cb; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1a17; --card:#27231f; --ink:#f0e9df; --accent:#d9a066; --line:#443c34; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.7; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 64px; }
  .brand { text-align:center; letter-spacing:.3em; color:var(--accent); font-weight:700; }
  h1 { font-size:1.4rem; text-align:center; margin:4px 0 16px; }
  h2 { font-size:1rem; color:var(--accent); margin:0 0 8px; text-align:center; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin:16px 0; }
  label { display:block; font-weight:600; font-size:.92rem; margin-bottom:4px; }
  input { width:100%; padding:10px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:8px; }
  button { width:100%; padding:14px; margin-top:12px; font:inherit; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  .note { font-size:.85rem; opacity:.8; }
  .err { color:var(--err); font-size:.85rem; min-height:1.2em; }
  #result { display:none; }
  .pillar { text-align:center; font-size:2.4rem; font-weight:700; color:var(--accent); letter-spacing:.1em; margin:0; }
  .yomi { text-align:center; margin:0 0 4px; opacity:.8; }
  .art { text-align:center; }
  .art svg { width:150px; height:150px; border-radius:18px; border:1px solid var(--line); }
  .big { text-align:center; font-size:1.6rem; font-weight:700; margin:8px 0 0; }
  .sub { text-align:center; opacity:.8; margin:0; }
  .tag { display:inline-block; padding:2px 14px; border-radius:999px; color:#fff; font-weight:700; font-size:1.2rem; }
  .season { text-align:center; margin:8px 0 0; }
  .meaning { margin:12px 0 0; padding:12px; border-left:4px solid var(--accent); background:rgba(138,90,43,.08); white-space:pre-wrap; display:none; }
</style>
</head>
<body>
<main>
  <div class="brand">KAGAMI</div>
  <h1>宿命早見</h1>

  <section>
    <label for="birth">生年月日(例：20000218)</label>
    <input type="text" id="birth" inputmode="numeric" maxlength="8" placeholder="20000218">
    <span class="err" id="err"></span>
    <button type="button" id="go">調べる</button>
  </section>

  <div id="result">
    <section>
      <p class="pillar" id="pillar"></p>
      <p class="yomi" id="pillarYomi"></p>
      <p class="sub" id="pillarLabel"></p>
    </section>

    <section>
      <h2>あなたを自然に例えると</h2>
      <div class="art" id="art"></div>
      <p class="big" id="natureName"></p>
      <p class="sub" id="kanName"></p>
      <div class="meaning" id="kanMeaning"></div>
    </section>

    <section>
      <h2>あなたの季節</h2>
      <p class="season"><span class="tag" id="seasonTag"></span></p>
      <p class="sub" id="shiName"></p>
      <div class="meaning" id="shiMeaning"></div>
    </section>

    <section id="pillarBox" style="display:none">
      <h2>あなたの日柱について</h2>
      <div class="meaning" id="pillarMeaning" style="display:block"></div>
    </section>

    <p class="note">日柱は、生年月日だけで決まります。日付は0時で切り替わる前提です。</p>
  </div>
</main>

<script>
// 日干(十干):文字, 読み, 五行, 陰陽, 自然のたとえ
var KAN = [
  ['甲', 'きのえ', '木', '陽', '大木'],
  ['乙', 'きのと', '木', '陰', '草花'],
  ['丙', 'ひのえ', '火', '陽', '太陽'],
  ['丁', 'ひのと', '火', '陰', '灯火'],
  ['戊', 'つちのえ', '土', '陽', '山'],
  ['己', 'つちのと', '土', '陰', '田んぼ・土壌'],
  ['庚', 'かのえ', '金', '陽', '剣'],
  ['辛', 'かのと', '金', '陰', '宝石'],
  ['壬', 'みずのえ', '水', '陽', '海'],
  ['癸', 'みずのと', '水', '陰', '雨・小川']
];
// 日支(十二支):文字, 読み, 季節の表現, 季節
var SHI = [
  ['子', 'ね', '冬の真ん中', '冬'],
  ['丑', 'うし', '冬の終わり', '冬'],
  ['寅', 'とら', '春の初め', '春'],
  ['卯', 'う', '春の真ん中', '春'],
  ['辰', 'たつ', '春の終わり', '春'],
  ['巳', 'み', '夏の初め', '夏'],
  ['午', 'うま', '夏の真ん中', '夏'],
  ['未', 'ひつじ', '夏の終わり', '夏'],
  ['申', 'さる', '秋の初め', '秋'],
  ['酉', 'とり', '秋の真ん中', '秋'],
  ['戌', 'いぬ', '秋の終わり', '秋'],
  ['亥', 'い', '冬の初め', '冬']
];
var SEASON_COLOR = { '春': '#e879a8', '夏': '#e8a317', '秋': '#c2571a', '冬': '#3b82c4' };

// 自然のイラスト(十干ごと)
var ART = {
  '甲': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#ecfccb"/><rect y="106" width="120" height="14" fill="#a3e635"/><path d="M52 110 L56 66 H64 L68 110Z" fill="#92400e"/><circle cx="60" cy="46" r="28" fill="#15803d"/><circle cx="38" cy="58" r="18" fill="#16a34a"/><circle cx="82" cy="58" r="18" fill="#16a34a"/><circle cx="60" cy="34" r="16" fill="#22c55e"/></svg>',
  '乙': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#fdf2f8"/><rect y="104" width="120" height="16" fill="#86efac"/><path d="M20 106 L24 90 L28 106Z M92 106 L97 88 L101 106Z M30 106 L33 94 L37 106Z" fill="#22c55e"/><path d="M60 106 Q57 82 60 56" stroke="#16a34a" stroke-width="4" fill="none"/><path d="M60 90 Q42 88 38 74 Q56 72 60 90Z" fill="#22c55e"/><path d="M60 82 Q78 80 82 66 Q64 64 60 82Z" fill="#16a34a"/><circle cx="60" cy="33" r="10" fill="#f472b6"/><circle cx="74" cy="43" r="10" fill="#f472b6"/><circle cx="69" cy="58" r="10" fill="#f472b6"/><circle cx="51" cy="58" r="10" fill="#f472b6"/><circle cx="46" cy="43" r="10" fill="#f472b6"/><circle cx="60" cy="48" r="8" fill="#fde047"/></svg>',
  '丙': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#fef3c7"/><g stroke="#f59e0b" stroke-width="5" stroke-linecap="round"><line x1="60" y1="10" x2="60" y2="24"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(30 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(60 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(90 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(120 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(150 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(180 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(210 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(240 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(270 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(300 60 60)"/><line x1="60" y1="10" x2="60" y2="24" transform="rotate(330 60 60)"/></g><circle cx="60" cy="60" r="28" fill="#f97316"/><circle cx="60" cy="60" r="21" fill="#fb923c"/></svg>',
  '丁': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#312e81"/><circle cx="60" cy="50" r="34" fill="#fbbf24" opacity=".25"/><rect x="50" y="68" width="20" height="38" rx="3" fill="#fef3c7"/><rect x="59" y="58" width="2" height="12" fill="#44403c"/><path d="M60 22 C74 38 76 54 60 64 C44 54 46 38 60 22Z" fill="#f97316"/><path d="M60 38 C68 48 68 56 60 62 C52 56 52 48 60 38Z" fill="#fde047"/><rect x="40" y="104" width="40" height="6" rx="3" fill="#a16207"/></svg>',
  '戊': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#e0f2fe"/><path d="M-10 112 L38 42 L86 112Z" fill="#a8a29e"/><path d="M30 112 L80 28 L130 112Z" fill="#78716c"/><path d="M80 28 L68 50 L76 46 L82 54 L88 46 L96 50Z" fill="#fff"/><rect y="108" width="120" height="12" fill="#65a30d"/></svg>',
  '己': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#bae6fd"/><path d="M0 50 Q30 36 60 48 T120 44 V58 H0Z" fill="#86efac"/><rect y="56" width="120" height="64" fill="#a16207"/><path d="M12 64 H108 L116 84 H4Z" fill="#7dd3fc"/><path d="M2 90 H118 L120 114 H0Z" fill="#7dd3fc"/><g stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"><path d="M24 76 V70 M40 76 V70 M56 76 V70 M72 76 V70 M88 76 V70 M104 76 V70"/><path d="M14 106 V98 M34 106 V98 M54 106 V98 M74 106 V98 M94 106 V98 M110 106 V98"/></g></svg>',
  '庚': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#f1f5f9"/><path d="M60 8 L68 26 V76 H52 V26Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><path d="M60 14 V76" stroke="#94a3b8" stroke-width="2"/><rect x="38" y="76" width="44" height="8" rx="3" fill="#d97706"/><rect x="55" y="84" width="10" height="20" rx="2" fill="#7c2d12"/><circle cx="60" cy="108" r="6" fill="#d97706"/><path d="M88 22 l2 6 l6 2 l-6 2 l-2 6 l-2-6 l-6-2 l6-2z" fill="#fde047"/></svg>',
  '辛': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#faf5ff"/><path d="M48 28 L56 44 H36Z" fill="#c4b5fd"/><path d="M48 28 H72 L64 44 H56Z" fill="#ddd6fe"/><path d="M72 28 L84 44 H64Z" fill="#8b5cf6"/><path d="M36 44 H56 L60 94Z" fill="#8b5cf6"/><path d="M56 44 H64 L60 94Z" fill="#a78bfa"/><path d="M64 44 H84 L60 94Z" fill="#6d28d9"/><path d="M96 20 l3 8 l8 3 l-8 3 l-3 8 l-3-8 l-8-3 l8-3z" fill="#fde047"/><path d="M22 76 l2 5 l5 2 l-5 2 l-2 5 l-2-5 l-5-2 l5-2z" fill="#fde047"/></svg>',
  '壬': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#e0f2fe"/><circle cx="92" cy="30" r="11" fill="#fde68a"/><path d="M0 62 Q15 50 30 62 T60 62 T90 62 T120 62 V120 H0Z" fill="#60a5fa"/><path d="M0 78 Q15 66 30 78 T60 78 T90 78 T120 78 V120 H0Z" fill="#3b82f6"/><path d="M0 94 Q15 82 30 94 T60 94 T90 94 T120 94 V120 H0Z" fill="#1d4ed8"/></svg>',
  '癸': '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#e8eef5"/><g fill="#94a3b8"><circle cx="44" cy="38" r="14"/><circle cx="62" cy="31" r="17"/><circle cx="79" cy="40" r="13"/><rect x="34" y="38" width="56" height="15" rx="7"/></g><g stroke="#3b82f6" stroke-width="3" stroke-linecap="round"><path d="M44 62 l-4 12"/><path d="M60 62 l-4 12"/><path d="M76 62 l-4 12"/><path d="M52 78 l-4 12"/><path d="M68 78 l-4 12"/></g><path d="M0 106 Q20 96 40 106 T80 106 T120 106 V120 H0Z" fill="#60a5fa"/></svg>'
};

// 日干の意味(スプレッドシートを読めないときの予備。読み込めたら、シートの内容が優先される)
var KAN_TEXT = {
  '甲': '甲→樹木（甲木は一本松とかのイメージだから1人でやっていけるが、折れたり、倒れたら立ち直るのに時間がかかるのであまり倒れることなくやっていった方が良い）\n長い年月をかけて、ゆっくりとまっすぐに伸びる大樹。\nストレート。頑固。スローテンポ。',
  '乙': '乙→草木、草花（草や花は何回踏まれてもアスファルトからでも出てくる。外は弱いけど、実は中はしっかり芯がある）\n優しさと美しさ。その魅力を集団の中で発揮する人。\n柔軟性。粘り強さ。外柔内剛。',
  '丙': '丙→太陽（太陽みたいな人が多い）\n明るさや暖かさなどを与えることが喜びになる。\n根が明るい人。奉仕。楽天的。おおらか。',
  '丁': '丁→灯火（夜行性の人が多い）\nろうそくの火や勢いがある焚き火。照明。\n情熱的。明るさ。デリケート。直観。',
  '戊': '戊→山（どんとしている）\n大きく高くそびえる山岳のイメージ。\n不動。受け身。現実的。守備。',
  '己': '己→田、畑（人を育てるのが得意）\n大地。平地。畑。田んぼ。植物や農作物をはぐくむ大地。\n豊かな魅力と才能。庶民性。広大。育成。',
  '庚': '庚→刃物、鉄\n鉄でできた大きな刃物。\n斧。刀。硬くて強いもの。\n意志堅固。正直。爽やかで行動力のある猪突猛進型。攻撃。たくましさ。勇敢。',
  '辛': '辛→宝石（キラキラしている)\n原石から研磨された宝石。貴金属。\nプライド。品格。純粋。美意識。繊細。きらびやか。',
  '壬': '壬→海（濁りもあるし、綺麗もあり、色んな物を受け止める。変な人も良い人も受け止める。）\n果てしなく広がる大きな海。湖。大きな川。\n冷静。大胆。柔軟性。流動。変動。自由。',
  '癸': '癸→雨、小川\n生きるために欠かすことができない水。\n母性愛豊か。知性。理性。集まる。教育。実用的な知恵。'
};
var MEANINGS = { kan: {}, shi: {}, pillar: {} };
Object.keys(KAN_TEXT).forEach(function (k) { MEANINGS.kan[k] = { text: KAN_TEXT[k] }; });
var current = null;

function $(id) { return document.getElementById(id); }

// 日付(グレゴリオ暦)からユリウス日を求め、60で割った余りから日柱を出す
function dayIndex(y, m, d) {
  var a = Math.floor((14 - m) / 12);
  var yy = y + 4800 - a;
  var mm = m + 12 * a - 3;
  var jdn = d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  return (((jdn - 11) % 60) + 60) % 60;
}

function validBirth(s) {
  if (!/^[0-9]{8}$/.test(s)) return false;
  var y = +s.slice(0, 4), m = +s.slice(4, 6), d = +s.slice(6, 8);
  var dt = new Date(y, m - 1, d);
  return y >= 1900 && dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

function showText(id, text) {
  var el = $(id);
  el.textContent = text || '';
  el.style.display = text ? 'block' : 'none';
}

function run() {
  var s = $('birth').value.trim().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 65248); });
  $('err').textContent = '';
  $('result').style.display = 'none';
  if (!validBirth(s)) { $('err').textContent = '8桁の数字で入力してください(例：20000218)'; return; }
  var i = dayIndex(+s.slice(0, 4), +s.slice(4, 6), +s.slice(6, 8));
  var k = KAN[i % 10], z = SHI[i % 12];
  $('pillar').textContent = k[0] + z[0];
  $('pillarYomi').textContent = k[1] + ' ・ ' + z[1];
  $('art').innerHTML = ART[k[0]];
  $('natureName').textContent = k[4];
  $('kanName').textContent = '日干　' + k[0] + '(' + k[1] + ')　' + k[3] + 'の' + k[2];
  $('seasonTag').textContent = z[2];
  $('seasonTag').style.background = SEASON_COLOR[z[3]];
  $('shiName').textContent = '日支　' + z[0] + '(' + z[1] + ')';
  current = { k: k, z: z };
  renderMeanings();
  $('result').style.display = 'block';
}

// スプレッドシートから読み込んだ意味文を、画面に出す
function renderMeanings() {
  if (!current) return;
  var kd = MEANINGS.kan[current.k[0]], sd = MEANINGS.shi[current.z[0]], pd = MEANINGS.pillar[current.k[0] + current.z[0]];
  showText('kanMeaning', kd && kd.text);
  showText('shiMeaning', sd && sd.text);
  $('pillarLabel').textContent = (pd && pd.label) ? pd.label : '';
  $('pillarBox').style.display = (pd && pd.text) ? 'block' : 'none';
  $('pillarMeaning').textContent = (pd && pd.text) ? pd.text : '';
}

$('go').addEventListener('click', run);
$('birth').addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });

// Apps Script上で開かれたときは、スプレッドシートから意味文を読み込む
if (window.google && google.script && google.script.run) {
  google.script.run.withSuccessHandler(function (m) {
    if (m) {
      var kan = MEANINGS.kan;
      Object.keys(m.kan || {}).forEach(function (k) { if (m.kan[k].text) kan[k] = m.kan[k]; });
      MEANINGS = { kan: kan, shi: m.shi || {}, pillar: m.pillar || {} };
      renderMeanings();
    }
  }).getMeanings();
}
</script>
</body>
</html>
